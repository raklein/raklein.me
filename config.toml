# 6. ALL Parameters Merged (The [params] section)
[params]
  description = "Richard Klein"
  syntaxHighlighter = "highlight.js"
  clearReading = true
  hierarchicalCategories = true
  sidebarBehavior = 1
  coverImage = "images/cover.jpg"
  imageGallery = true
  thumbnailImage = true
  thumbnailImagePosition = "bottom"
  autoThumbnailImage = true
  disqusShortname = ""
  # dateFormat = "2 January 2006"

  # Nester Author block to fix the ".Site.Author was removed" error
  [params.author]
    name = "Richard Klein"
    bio = "Clinical Data Scientist at the Food and Drug Administration analyzing safety signals in New Drug Applications. Former academic who focused on replication and methods for robust science in Psychology. <br>raklein22@gmail.com"
    job = "Clinical Data Scientist @ FDA"
    location = "Silver Spring, Maryland"
    gravatarEmail = "raklein22@gmail.com"
    picture = "cdn1.iconfinder.com"
