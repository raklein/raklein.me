baseURL = "/"
publishDir = "public"
languageCode = "en-us"
defaultContentLanguage = "en-us"
title = "Richard Klein"
theme = "hugo-tranquilpeak-theme"

# 1. Modernized pagination for 2026
[pagination]
  pagerSize = 7

# 2. Disable Google Analytics to bypass theme template errors
[services]
  [services.googleAnalytics]
    id = ""
  [services.disqus]
    shortname = "" # Leave empty if not using Disqus
# 3. Enable raw HTML for RMarkdown compatibility
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# 4. Global Settings
canonifyurls = true
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]

[permalinks]
  post = "/:year/:month/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"
  archive = "archives"

# 5. Menus
[[menu.main]]
  weight = 1
  identifier = "home"
  name = "Home"
  pre = "<i class=\"sidebar-button-icon fa fa-lg fa-home\"></i>"
  url = "/"
[[menu.main]]
  weight = 2
  identifier = "vita"
  name = "CV"
  pre = "<i class=\"sidebar-button-icon fa fa-lg fa-archive\"></i>"
  url = "github.com"
[[menu.main]]
  weight = 3
  identifier = "resume"
  name = "Resume"
  pre = "<i class=\"sidebar-button-icon fa fa-lg fa-file\"></i>"
  url = "img/klein_resume_web.pdf"
[[menu.main]]
  weight = 4
  identifier = "about"
  name = "About"
  pre = "<i class=\"sidebar-button-icon fa fa-lg fa-question\"></i>"
  url = "/#about"

[[menu.links]]
  weight = 1
  identifier = "github"
  name = "GitHub"
  pre = "<i class=\"sidebar-button-icon fa fa-lg fa-github\"></i>"
  url = "github.com"
[[menu.links]]
  weight = 2
  identifier = "osf"
  name = "OSF"
  pre = "<i class=\"sidebar-button-icon fa fa-lg fa-flask\"></i>"
  url = "osf.io"
[[menu.links]]
  weight = 3
  identifier = "scholar"
  name = "Scholar"
  pre = "<i class=\"sidebar-button-icon fa fa-lg fa-google\"></i>"
  url = "scholar.google.com"
[[menu.links]]
